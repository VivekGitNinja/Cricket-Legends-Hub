name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & publish frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (GitHub Pages subpath base)
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE: /Cricket-Legends-Hub/
          # Optional: set the repository secret VITE_API_URL to the deployed
          # backend (e.g. https://cricket-legends-api.onrender.com/api) and the
          # hosted site will talk to the real API + database. Without it the
          # static site falls back to baked-in local data.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Add SPA fallback + no-Jekyll marker
        working-directory: frontend
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish dist to gh-pages branch
        run: |
          cd frontend/dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
